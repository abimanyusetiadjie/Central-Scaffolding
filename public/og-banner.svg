  </text>

  <!-- Bottom Technical Spec Cards -->
  <g>
    <rect x="64" y="446" width="240" height="106" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <text x="84" y="478" fill="#A1A1AA" font-family="monospace" font-size="14">KAPASITAS READY</text>
    <text x="84" y="520" fill="#F59E0B" font-family="monospace" font-weight="700" font-size="30">5.000+ SET</text>

    <rect x="324" y="446" width="260" height="106" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <text x="344" y="478" fill="#A1A1AA" font-family="monospace" font-size="14">KETEBALAN PIPA SNI</text>
    <text x="344" y="520" fill="#FFFFFF" font-family="monospace" font-weight="700" font-size="28">1.8 - 2.0 MM</text>

    <rect x="604" y="446" width="240" height="106" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <text x="624" y="478" fill="#A1A1AA" font-family="monospace" font-size="14">SLA PENGIRIMAN</text>
    <text x="624" y="520" fill="#F59E0B" font-family="monospace" font-weight="700" font-size="28">&lt; 4 JAM TIBA</text>
  </g>

  <!-- Right Column CAD Isometric Wireframe Box -->
  <g>
    <rect x="876" y="72" width="260" height="480" fill="#18181B" stroke="#F59E0B" stroke-width="2"/>
