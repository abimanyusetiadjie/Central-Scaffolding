  <rect width="1200" height="630" fill="#09090B"/>

  <!-- Architectural Blueprint Grid Pattern -->
  <g stroke="#18181B" stroke-width="1.5">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Outer Structural Frame & Safety Amber Top/Bottom Bars -->
  <rect x="24" y="24" width="1152" height="582" stroke="#3F3F46" stroke-width="3" fill="none"/>
  <rect x="24" y="24" width="1152" height="12" fill="#F59E0B"/>
  <rect x="24" y="594" width="1152" height="12" fill="#F59E0B"/>

  <!-- Top Brand Header Strip -->
  <rect x="64" y="72" width="68" height="68" fill="#F59E0B" stroke="#FBBF24" stroke-width="2"/>
  <text x="80" y="117" fill="#09090B" font-family="monospace" font-weight="800" font-size="32">CS</text>

  <text x="152" y="104" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="30" letter-spacing="1">
    CENTRAL SCAFFOLDING
  </text>
  <text x="152" y="132" fill="#F59E0B" font-family="monospace" font-weight="700" font-size="16" letter-spacing="1.5">
    SUPPLIER TANGAN PERTAMA // GUDANG &amp; ARMADA SENDIRI
  </text>

  <!-- Status Badge -->
  <rect x="64" y="176" width="390" height="40" fill="#EA580C"/>
  <text x="82" y="202" fill="#FFFFFF" font-family="monospace" font-weight="700" font-size="17" letter-spacing="1">
    RENTAL MINGGUAN/BULANAN &bull; JUAL BARU &amp; BEKAS
  </text>

  <!-- Main Headline -->
  <text x="64" y="282" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="52">
