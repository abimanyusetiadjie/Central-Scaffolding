    </text>
    <text x="896" y="494" fill="#E4E4E7" font-family="monospace" font-weight="700" font-size="14">
      2x CROSS BRACE
    </text>
    <text x="896" y="520" fill="#F59E0B" font-family="monospace" font-weight="700" font-size="14">
      4x JOINT PIN SHOCK
    </text>
  </g>
