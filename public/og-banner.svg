    <g stroke="#F59E0B" stroke-width="3" stroke-opacity="0.8">
      <rect x="926" y="138" width="160" height="140" fill="none"/>
      <rect x="926" y="278" width="160" height="140" fill="none"/>
      <line x1="926" y1="278" x2="1086" y2="278" stroke="#EA580C" stroke-width="5"/>
    </g>
    <g stroke="#F59E0B" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 4">
      <line x1="926" y1="138" x2="1086" y2="278"/>
      <line x1="1086" y1="138" x2="926" y2="278"/>
      <line x1="926" y1="278" x2="1086" y2="418"/>
      <line x1="1086" y1="278" x2="926" y2="418"/>
    </g>
    <!-- Base Plates -->
    <rect x="910" y="418" width="32" height="10" fill="#F59E0B"/>
    <rect x="1070" y="418" width="32" height="10" fill="#F59E0B"/>

    <text x="896" y="468" fill="#E4E4E7" font-family="monospace" font-weight="700" font-size="14">
