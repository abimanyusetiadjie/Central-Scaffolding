    <line x1="90" y1="220" x2="250" y2="220"/><line x1="90" y1="260" x2="250" y2="260"/><line x1="90" y1="300" x2="250" y2="300"/><line x1="90" y1="340" x2="250" y2="340"/><line x1="90" y1="380" x2="250" y2="380"/>
    <line x1="130" y1="180" x2="130" y2="436"/><line x1="210" y1="180" x2="210" y2="436"/>
  </g>
