    <line x1="310" y1="195" x2="490" y2="195"/><line x1="310" y1="240" x2="490" y2="240"/><line x1="310" y1="285" x2="490" y2="285"/><line x1="310" y1="330" x2="490" y2="330"/><line x1="310" y1="375" x2="490" y2="375"/>
